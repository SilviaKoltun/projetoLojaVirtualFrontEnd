<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Inova 3D</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-placeholder">
                    <span class="orage-text">3D</span>
                    <h1>INOVA 3D</h1>
                    <p class="subtitle"> INOVAÇÃO QUE GRANHA FORMA </p>
                </div>
            </div>

            <div class="features">
                <div class="feature-item">
                    <i class="fa-regular fa-lightbuld"></i>
                </div>

                <h3>Inovação</h3>
                <p> Soluções criativas e eficientes</p>
            </div>

            <div class="features">
                <div class="feature-item">
                    <i class="fa-regular fa-lightbuld"></i>
                </div>

                <h3>Tecnologia</h3>
                <p> Impressão 3D</p>
            </div>

            <div class="features">
                <div class="feature-item">
                    <i class="fa-regular fa-lightbuld"></i>
                </div>

                <h3>Precisão</h3>
                <p> Detalhes que fazem a diferença</p>
            </div>



        </aside>
        <main class="form-painel">
            <h2>Criar Conta</h2>
            <p class="form-desc"> Preencha os dados abaixo para criar sua conta na <span
                    class="orange-text font-bold">Inova
                    3D</span>.</p>


            <form>
                <div class="input-group">
                    <label> Nome Completo </label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" placeholder="Digite seu nome completo" required>
                    </div>
                </div>

                <div class="input-group">
                    <label> Email </label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="text" placeholder="Digite seu email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label> Telefone </label>
                    <div class=" input-wrapper">
                        <i class=" fa-solid   fa-phone"></i>
                        <input type="number" placeholder="(11)9999-9999" required>
                    </div>
                </div>

                <div class="input-group">
                    <label> Senha </label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-password"></i>
                        <input type="text" placeholder="Digite sua Senha" required>
                    </div>
                </div>

                <div class="input-group">
                    <label> Confirmar Senha </label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-password"></i>
                        <input type="text" placeholder="Confirme sua Senha" required>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label id="terms-label" for="terms">Eu concordo com os <a href="#">Termos de Uso</a> e a <a
                            href="#">Política de Privacidade</a>.</label>
                </div>

                <button type="submit" class="btn-submit">Cadastrar</button>
            </form>

            <div class="divider">
                <span>ou</span>
            </div>

            <button type="button" class="btn-google">
                <img src="https://wikimedia.org" alt="Google">
                Cadastrar com Google
            </button>

            <p class="footer-text">Já tem uma conta? <a href="#">Entrar</a></p>
        </main>
    </div>

</body>

</html>
