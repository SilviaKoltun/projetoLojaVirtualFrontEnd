<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - Inova 3D</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

</head>

<body>
    <div class="container">


        <aside class="sidebar">

            <div class="logo-area">

                <img src="./assets/logo.png" alt="Logo Inova 3D" class="logo">
            </div>

            <div class="features">

                <div class="feature-item">
                    <i class="ph ph-lightbulb-filament"></i>

                    <h3>Inovação</h3>

                    <p>
                        Soluções criativas<br>
                        e eficientes
                    </p>
                </div>

                <div class="feature-item">
                    <i class="ph ph-cube"></i>

                    <h3>Tecnologia</h3>

                    <p>
                        Impressão 3D de<br>
                        alta qualidade
                    </p>
                </div>

                <div class="feature-item">
                    <i class="ph ph-target"></i>

                    <h3>Precisão</h3>

                    <p>
                        Detalhes que<br>
                        fazem a diferença
                    </p>
                </div>

            </div>
        </aside>

        <main class="form-painel">

            <header class="form-header">
                <h1>Bem Vindo! </h1>
                <p class="form-desc">
                    Acesse sua conta e continue <br>
                    transformando ideias em realidade. </p>
            </header>

            <form id="login">
                <div class="input-group">
                    <label for="email">E-mail</label>

                    <div class="input-wrapper">
                        <i class="ph ph-envelope-simple"></i>
                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>

                    <div class="input-wrapper">
                        <i class="ph ph-lock"></i>

                        <input type="password" id="senha" placeholder="Digite sua senha" name="senha" minlength="8"
                            required>

                        <button type="button" class="toggle-password" aria-label="Mostrar senha">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>

                    <small class="helper-text">
                        Esqueceu sua senha
                    </small>
                </div>

                <button type="submit" class="btn-submit">
                    Entrar
                </button>

            </form>
            <div class="divider">
                <span>ou</span>
            </div>

            <div id="google-btn"></div>

            <p class="footer-text">
                ainda não tem uma conta? <a href="./index.html">Criar Conta</a>
            </p>
        </main>
    </div>

    <script>

        const botoesSenha = document.querySelectorAll(".toggle-password");

        botoesSenha.forEach((botao) => {

            botao.addEventListener("click", () => {

                const input = botao.parentElement.querySelector("input");
                const icone = botao.querySelector("i");

                const senhaVisivel = input.type === "text";

                input.type = senhaVisivel ? "password" : "text";

                icone.classList.toggle("ph-eye");
                icone.classList.toggle("ph-eye-slash");

            });

        });


        const form = document.querySelector("#login");

        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const email = document.querySelector("#email").value.trim();
            const senha = document.querySelector("#senha").value;

            const data = {
                email,
                senha
            };

            try {

                const response = await fetch(
                    "https://loja-virtual-production-6104.up.railway.app/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(data)
                    }
                );

                const dados = await response.json();

                if (!response.ok) {

                    alert(
                        dados.erro ||
                        dados.message ||
                        "E-mail ou senha inválidos."
                    );

                    return;
                }

                localStorage.setItem("token", dados.token);

                localStorage.setItem(
                    "usuario",
                    JSON.stringify(dados.usuario)
                );

                window.location.href = "./produtos.html";

            } catch (erro) {

                console.error("Erro no login:", erro);

                alert("Não foi possível conectar ao servidor.");

            }

        });


        async function loginComGoogle(response) {

            try {

                const respostaBackend = await fetch(
                    "https://loja-virtual-production-6104.up.railway.app/auth/google",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            credential: response.credential
                        })
                    }
                );

                const dados = await respostaBackend.json();

                if (!respostaBackend.ok) {

                    alert(
                        dados.erro ||
                        dados.message ||
                        "Não foi possível entrar com Google."
                    );

                    return;
                }

                localStorage.setItem("token", dados.token);

                localStorage.setItem(
                    "usuario",
                    JSON.stringify(dados.usuario)
                );

                window.location.href = "./produtos.html";

            } catch (erro) {

                console.error("Erro no login Google:", erro);

                alert("Não foi possível entrar com Google.");

            }

        }

        window.addEventListener("load", () => {

            google.accounts.id.initialize({

                client_id: "1074203320076-b3makfs3nk7e4mt9bsj43rs9nmu7pm24.apps.googleusercontent.com",

                callback: loginComGoogle

            });
            const googleBtn = document.getElementById("google-btn");
            const larguraGoogle = Math.min(
                googleBtn.offsetWidth,
                480
            );

            google.accounts.id.renderButton(
                googleBtn,
                {
                    theme: "outline",
                    size: "large",
                    text: "signin_with",
                    shape: "rectangular",
                    width: 480
                }
            );


        });

    </script>


</body>

</html>
