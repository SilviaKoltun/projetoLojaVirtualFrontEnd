<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta - Inova 3D</title>

    <link rel="stylesheet" href="style.css">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    >
</head>

<body>
    <div class="container">

        
        <aside class="sidebar">

            <div class="logo-area">
                
                <img
                    src="./assets/logo.png"
                    alt="Logo Inova 3D"
                    class="logo"
                >
            </div>

            <div class="features">

                <div class="feature-item">
                    <i class="ph ph-lightbulb-filament"></i>

                    <h3>Inovação</h3>

                    <p>
                        Soluções criativas<br>
                        e eficientes
                    </p>
                </div>

                <div class="feature-item">
                    <i class="ph ph-cube"></i>

                    <h3>Tecnologia</h3>

                    <p>
                        Impressão 3D de<br>
                        alta qualidade
                    </p>
                </div>

                <div class="feature-item">
                    <i class="ph ph-target"></i>

                    <h3>Precisão</h3>

                    <p>
                        Detalhes que<br>
                        fazem a diferença
                    </p>
                </div>

            </div>
        </aside>

        <main class="form-painel">

            <header class="form-header">
                <h1>Bem Vindo! </h1>
                <p class="form-desc">
                    Acesse sua conta e continue  <br>
                    transformando ideias em realidade. </p>
            </header>

        <form> 
            <div class="input-group">
                <label for="email">E-mail</label>

                <div class="input-wrapper">
                    <i class="ph ph-envelope-simple"></i>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>

                <div class="input-wrapper">
                    <i class="ph ph-lock"></i>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        minlength="8"
                        required>

                <button
                    type="button"
                    class="toggle-password"
                    aria-label="Mostrar senha">
                    <i class="ph ph-eye"></i>
                </button>
            </div>

                <small class="helper-text">
                    Esqueceu sua senha
                </small>
            </div>

            <button type="submit" class="btn-submit">
                Entrar
            </button>

        </form>
         <div class="divider">
                <span>ou</span>
        </div>

            <button type="button" class="btn-google">
                <span class="google-icon">G</span>
                Entrar com Google
            </button>
             <p class="footer-text">
                ainda não tem uma conta? <a href="cadastro.html">Criar Conta</a>
             </p>
        </main>
    </div>


</body>

</html>
