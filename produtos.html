<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Início - Inova 3D</title>

  <link rel="stylesheet" href="produtos.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
</head>

<body>
  <div class="pagina">
    <header class="cabecalho">
      <div class="cabecalho-superior">
        <div class="espaco-menu" aria-hidden="true"></div>
        
        <div class="marca">
          <img src="./assets/logo.png" alt="Logo Inova 3D" class="logo" />

          <div class="nome-marca">
            <span>INOVA</span>
            <strong>3D</strong>
            <small>INOVAÇÃO QUE GANHA FORMA</small>
          </div>
        </div>

        <button type="button" class="botao-carrinho" aria-label="Abrir carrinho de compras"
          onclick="window.location.href = './carrinho.html'">
          <i class="ph ph-shopping-cart-simple"></i>

          <span class="contador-carrinho" id="contador-carrinho">0</span>
        </button>
      </div>

      <div class="campo-busca">
        <i class="ph ph-magnifying-glass"></i>

        <input type="search" id="busca" placeholder="Buscar produtos..." aria-label="Buscar produtos" />
      </div>
    </header>

    <main>
      <section class="banner">
        <img src="./assets/banner-inova3d.png" alt="Inova 3D - Soluções impressas em 3D para o seu dia a dia"
          class="banner-imagem" />
      </section>

     
      </section>

      <section class="secao-categorias" id="categorias">
        <div class="titulo-secao">
          <h2>Categorias</h2>
        </div>

        <div class="categorias">
          <button type="button" class="categoria-item">
            <i class="ph ph-squares-four"></i>
            <span>Todos</span>
          </button>

          <button type="button" class="categoria-item">
            <i class="ph ph-device-mobile"></i>
            <span>Acessórios</span>
          </button>

          <button type="button" class="categoria-item">
            <i class="ph ph-house"></i>
            <span>Decoração</span>
          </button>

          <button type="button" class="categoria-item">
            <i class="ph ph-archive"></i>
            <span>Organização</span>
          </button>

          <button type="button" class="categoria-item">
            <i class="ph ph-paw-print"></i>
            <span>Pet</span>
          </button>

          <button type="button" class="categoria-item">
            <i class="ph ph-wrench"></i>
            <span>Oficina</span>
          </button>
        </div>
      </section>

      <section class="secao-produtos">
        <div class="titulo-secao">
          <h2>Produtos</h2>
        </div>

        <div id="lista-produtos" class="lista-produtos"></div>
      </section>

      <section class="vantagens">
        <div class="vantagem-item">
          <i class="ph ph-shield-check"></i>

          <div>
            <h3>Pagamento Seguro</h3>
            <p>Seus dados protegidos</p>
          </div>
        </div>

        <div class="vantagem-item">
          <i class="ph ph-truck"></i>

          <div>
            <h3>Envio Rápido</h3>
            <p>Para todo o Brasil</p>
          </div>
        </div>

        <div class="vantagem-item">
          <i class="ph ph-seal-check"></i>

          <div>
            <h3>Qualidade Garantida</h3>
            <p>Impressão 3D de alta qualidade</p>
          </div>
        </div>

        <div class="vantagem-item">
          <i class="ph ph-headset"></i>

          <div>
            <h3>Atendimento Especializado</h3>
            <p>Estamos prontos para ajudar</p>
          </div>
        </div>
      </section>
    </main>

    <nav class="menu-inferior">

      <a href="./produtos.html" class="menu-item">
        <i class="ph ph-house"></i>
        <span>Início</span>
      </a>

      <a href="./produtos.html#categorias" class="menu-item">
        <i class="ph ph-squares-four"></i>
        <span>Categorias</span>
      </a>

      <a href="#" class="menu-item" id="menu-favoritos">
        <i class="ph ph-heart"></i>
        <span>Favoritos</span>
      </a>

      <a href="#" class="menu-item" id="btn-sair">
        <i class="ph ph-sign-out"></i>
        <span>Sair</span>
      </a>

      <a href="./conta.html" class="menu-item">
        <i class="ph ph-user"></i>
        <span>Conta</span>
      </a>

    </nav>

    <script>
      const token = localStorage.getItem("token");
      const contadorCarrinho = document.getElementById("contador-carrinho");
      let todosProdutos = [];

      async function atualizarContadorCarrinho() {
        try {
          const resposta = await fetch("https://loja-virtual-production-6104.up.railway.app/carrinho", {
            method: "GET",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
          });

          if (!resposta.ok) {
            throw new Error("Erro ao buscar carrinho");
          }

          const carrinho = await resposta.json();

          const quantidadeTotal = carrinho.reduce(
            (total, item) => total + item.quantidade,
            0
          );

          contadorCarrinho.textContent = quantidadeTotal;

          if (quantidadeTotal === 0) {
            contadorCarrinho.style.display = "none";
          } else {
            contadorCarrinho.style.display = "flex";
          }

        } catch (erro) {
          console.error("Erro ao atualizar contador do carrinho:", erro);
          contadorCarrinho.style.display = "none";
        }
      }

      const listarProdutos = document.querySelector("#lista-produtos");

      const imagemPadrao = "./assets/suporte_para_Celular_3d.png";

      console.log("Token:", token); // Adicione este log para verificar o valor do token
      if (!token) {
        window.location.href = "./login.html";
      }

      const formatarPreco = (valor) =>
        Number(valor).toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
        });

      const adicionarAoCarrinho = async (produtoId) => {
        try {
          const resposta = await fetch("https://loja-virtual-production-6104.up.railway.app/carrinho", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ produtoId, quantidade: 1 }),
          });

          const dados = await resposta.json();

          if (!resposta.ok) {
            alert(dados.erro || "Não foi possível adicionar ao carrinho.");
            return;
          }

          window.location.href = "./carrinho.html";
        } catch (erro) {
          alert("Não foi possível conectar ao servidor.");
        }
      };

      const mostrarProdutos = (produtos) => {
        listarProdutos.innerHTML = "";

        if (produtos.length === 0) {
          listarProdutos.innerHTML = `
        <p class="mensagem-erro">
            Nenhum produto encontrado.
        </p>
    `;
          return;
        }

        produtos.forEach((produto) => {

          const elementoProduto = document.createElement("article");
          elementoProduto.className = "produto";

          elementoProduto.innerHTML = `
            <img
                src="${produto.imagem || imagemPadrao}"
                alt="${produto.nome}"
                class="imagem-produto"
            >

            <div class="produto-conteudo">

                <button
                    type="button"
                    class="botao-favorito"
                    aria-label="Adicionar aos favoritos"
                >
                    <i class="ph ph-heart"></i>
                </button>

                <h3>${produto.nome}</h3>

                <p class="descricao">
                    ${produto.descricao || "Produto fabricado com impressão 3D"}
                </p>

                <strong class="preco">
                    ${formatarPreco(produto.preco)}
                </strong>

                <button
                    type="button"
                    class="botao-comprar"
                    data-produto-id="${produto.id}"
                >
                    Comprar
                </button>

            </div>
        `;

          const botaoComprar =
            elementoProduto.querySelector(".botao-comprar");

          botaoComprar.addEventListener("click", () => {
            adicionarAoCarrinho(produto.id);
          });

          const botaoFavoritar =
            elementoProduto.querySelector(".botao-favorito");

          let favoritos =
            JSON.parse(localStorage.getItem("favoritos")) || [];

          if (favoritos.includes(produto.id)) {
            botaoFavoritar.classList.add("favorito");
          }

          botaoFavoritar.addEventListener("click", () => {

            favoritos =
              JSON.parse(localStorage.getItem("favoritos")) || [];

            if (favoritos.includes(produto.id)) {

              favoritos = favoritos.filter(
                id => id !== produto.id
              );

              botaoFavoritar.classList.remove("favorito");

            } else {

              favoritos.push(produto.id);

              botaoFavoritar.classList.add("favorito");
            }

            localStorage.setItem(
              "favoritos",
              JSON.stringify(favoritos)
            );
          });

          listarProdutos.appendChild(elementoProduto);

        });
      };
      const botoesCategorias = document.querySelectorAll(".categoria-item");

      botoesCategorias.forEach((botao) => {

        botao.addEventListener("click", () => {

          const categoriaSelecionada =
            botao.querySelector("span").textContent.trim();

          console.log("CATEGORIA CLICADA:", categoriaSelecionada);


          // Se clicar em Todos, mostra todos os produtos
          if (categoriaSelecionada === "Todos") {
            mostrarProdutos(todosProdutos);
            return;
          }

          // Filtra pela categoria do produto
          const produtosFiltrados = todosProdutos.filter((produto) => {
            return produto.categoria?.nome === categoriaSelecionada;
          });

          mostrarProdutos(produtosFiltrados);
        });

      });

      async function fetchProdutos() {
        try {
          const resposta = await fetch("https://loja-virtual-production-6104.up.railway.app/produtos", {
            method: "GET",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
          });
          if (!resposta.ok) {
            throw new Error("Erro ao buscar produtos");
          }
          const produtos = await resposta.json();
          todosProdutos = produtos;

          // Verifica se veio pelo botão Favoritos
          const parametros = new URLSearchParams(window.location.search);
          const filtro = parametros.get("filtro");

          if (filtro === "favoritos") {

            const favoritos =
              JSON.parse(localStorage.getItem("favoritos")) || [];

            const produtosFavoritos = todosProdutos.filter((produto) =>
              favoritos.includes(produto.id)
            );

            mostrarProdutos(produtosFavoritos);

          } else {

            mostrarProdutos(todosProdutos);

          }
        } catch (erro) {
          listarProdutos.innerHTML = `
                 <p class="mensagem-erro">
                   Não foi possível carregar os produtos.
                 </p>
               `;
        }
      }
      const menuFavoritos = document.getElementById("menu-favoritos");

      if (menuFavoritos) {
        menuFavoritos.addEventListener("click", (event) => {
          event.preventDefault();

          const favoritos =
            JSON.parse(localStorage.getItem("favoritos")) || [];

          const produtosFavoritos = todosProdutos.filter((produto) =>
            favoritos.includes(produto.id)
          );

          mostrarProdutos(produtosFavoritos);
        });
      }

      fetchProdutos();

      const campoBusca = document.getElementById("busca");

      if (campoBusca) {
        campoBusca.addEventListener("input", () => {

          const textoBusca = campoBusca.value
            .toLowerCase()
            .trim();

          const produtosEncontrados = todosProdutos.filter((produto) => {

            const nome = produto.nome.toLowerCase();

            const descricao =
              (produto.descricao || "").toLowerCase();

            return (
              nome.includes(textoBusca) ||
              descricao.includes(textoBusca)
            );
          });

          mostrarProdutos(produtosEncontrados);
        });
      }

      atualizarContadorCarrinho();

      const btnSair = document.getElementById("btn-sair");

      if (btnSair) {
        btnSair.addEventListener("click", (event) => {
          event.preventDefault();

          localStorage.removeItem("token");

          window.location.href = "./login.html";
        });
      }

    </script>

</body>

</html>
